services:
  app:
    build:
      context: .
      dockerfile: ./Dockerfile.dev
    command: npm run dev
    volumes:
      - .:/app
      - /app/node_modules
      # Keep the dev server's lock file inside the container so a stopped
      # container can't leave a stale lock on the host bind mount.
      - /app/.nuxt
    environment:
      - NUXT_APP_BASE_URL=${NUXT_APP_BASE_URL:-/dc/lineage-builder}
      - NUXT_CLIENT_SECRET=${NUXT_CLIENT_SECRET:-}
      - NUXT_LINEAGE_HASH_SALT=${NUXT_LINEAGE_HASH_SALT:-salt}
      - NUXT_DB_HOST=${NUXT_DB_HOST:-db}
      - NUXT_DB_PORT=${NUXT_DB_PORT:-3306}
      - NUXT_DB_DATABASE=${NUXT_DB_DATABASE:-lineage_builder}
      - NUXT_DB_USER=${NUXT_DB_USER:-builder}
      - NUXT_DB_PASSWORD=${NUXT_DB_PASSWORD:-}
    ports:
      - 3000:3000
    depends_on:
      - db
    networks:
      - internal

  db:
    image: mariadb:10
    tty: true
    volumes:
      - dbdata:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    ports:
      - 3306:3306
    networks:
      - internal

  testapp:
    build:
      context: .
      dockerfile: ./Dockerfile.dev
    command: sleep infinity
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env.testing
    depends_on:
      testdb:
        condition: service_healthy
    networks:
      - testing

  testdb:
    image: mariadb:10
    tty: true
    env_file:
      - .env.testing
    networks:
      - testing
    healthcheck:
      test: mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER --password=$$MYSQL_PASSWORD
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 4

volumes:
  dbdata:

networks:
  internal:
  testing:
